version: "3"

info:
  companyName: ""
  productName: "Ladon"
  productIdentifier: "com.artemidas.ladon"
  description: "Kubernetes security review"
  copyright: ""
  comments: ""
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - src
      - bin
      - dist
      - graphify-out
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: go build -o bin/ladon .
      type: blocking
    - cmd: bun run dev
      type: background
    - cmd: ./bin/ladon
      type: primary
