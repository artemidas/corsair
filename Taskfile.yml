version: "3"

vars:
  VITE_PORT: 1420

tasks:
  generate:bindings:
    summary: Generate TypeScript bindings for Go services
    cmds:
      - wails3 generate bindings -ts -i -d ./src/bindings . ./project ./rule ./cluster ./scan ./images

  test:
    cmds:
      - go test ./...

  build:frontend:
    cmds:
      - bun run build

  build:
    deps: [generate:bindings, build:frontend]
    cmds:
      - go build -o bin/ladon .

  dev:
    summary: Run Ladon under Wails v3 (Vite on :1420)
    cmds:
      - task: generate:bindings
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
